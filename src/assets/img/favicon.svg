<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Degradado metálico principal estilo acero cepillado -->
    <linearGradient id="metal-body" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#e2e8f0"/>
      <stop offset="45%" stop-color="#94a3b8"/>
      <stop offset="70%" stop-color="#cbd5e1"/>
      <stop offset="90%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Bisel de iluminación superior -->
    <linearGradient id="metal-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#cbd5e1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Sombra de relieve tridimensional -->
    <filter id="drop-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Círculo base oscuro oficial -->
  <circle cx="256" cy="256" r="236" fill="#1e1e1e" stroke="#2d2d2d" stroke-width="4"/>

  <!-- Monograma Oficial JK -->
  <g filter="url(#drop-depth)">
    <!-- 1. Letra 'J' con ranura vertical interior y gancho continuo -->
    <path d="M 150 110 
             L 245 110 
             L 245 245 
             L 210 245 
             L 210 160 
             C 210 152, 203 146, 195 146 
             C 187 146, 180 152, 180 160 
             L 180 320 
             C 180 345, 160 360, 135 360 
             C 110 360, 95 345, 95 320 
             L 95 270 
             L 60 270 
             L 60 325 
             C 60 365, 85 390, 135 390 
             C 185 390, 215 365, 215 320 
             L 215 305 
             L 245 305 
             L 245 390 
             L 280 390 
             L 280 245 
             L 245 245 
             L 245 110 
             Z"
          fill="url(#metal-body)" 
          stroke="url(#metal-highlight)" 
          stroke-width="1.5" />

    <!-- 2. Brazo superior de la 'K' con corte superior plano y bisel a 45° -->
    <polygon points="230,225 345,110 410,110 295,225" 
             fill="url(#metal-body)" 
             stroke="url(#metal-highlight)" 
             stroke-width="1.5" />

    <!-- 3. Pierna inferior de la 'K' con corte inferior plano -->
    <polygon points="275,230 390,390 325,390 235,270" 
             fill="url(#metal-body)" 
             stroke="url(#metal-highlight)" 
             stroke-width="1.5" />
  </g>
</svg>

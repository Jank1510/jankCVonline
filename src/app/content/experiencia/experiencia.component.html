<div data-aos="fade-right" class="section-header">
    <hr><span>Experiencia</span>
</div>
<section class="content">
    <div class="experiencias">
        <article data-aos="fade-up" class="experiencia" *ngFor="let experiencia of experiencias">
            <div class="encabezado">
                <div>
                    <h1>{{experiencia.cargo}}</h1>
                    <h2>{{experiencia.empresa}}</h2>
                </div>
                <div class="metaExperiencia">
                    <span class="periodo">{{experiencia.periodo}}</span>
                    <span class="ubicacion">{{experiencia.ubicacion}}</span>
                </div>
            </div>

            <p class="descripcionCorta">{{experiencia.descripcionCorta}}</p>

            <div class="bloqueFunciones">
                <h3>Funciones principales</h3>
                <ul class="listaFunciones">
                    <li *ngFor="let funcion of experiencia.funcionesClave">{{funcion}}</li>
                </ul>
            </div>

            <!-- Desplegable para detalles secundarios (logros y competencias) -->
            <details class="desplegableExperiencia">
                <summary>
                    <span class="summaryTexto">Ver logros y competencias</span>
                    <svg class="chevronIcon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                        <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </summary>
                <div class="contenidoDesplegable">
                    <div class="bloqueLogros" *ngIf="experiencia.logros && experiencia.logros.length">
                        <h4>Logros destacados</h4>
                        <ul>
                            <li *ngFor="let logro of experiencia.logros">{{logro}}</li>
                        </ul>
                    </div>
                    <div class="aptitudes" *ngIf="experiencia.aptitudes && experiencia.aptitudes.length">
                        <span *ngFor="let aptitud of experiencia.aptitudes">{{aptitud}}</span>
                    </div>
                </div>
            </details>
        </article>
    </div>
</section>

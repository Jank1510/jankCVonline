<section class="contenedor">
  <div class="hero-centrado" data-aos="fade-up">
    <div class="disponibilidad">
      <span class="status-dot"></span>
      <span class="status-text">Disponible para servicios y proyectos</span>
    </div>

    <div class="perfil">
      <h1>
        <span class="brand-name">JANKOS</span>
        <span class="brand-tagline">Soporte técnico y soluciones tecnológicas</span>
      </h1>
    </div>

    <p class="descripcionHero">
      Especialistas en mantenimiento de computadores e impresoras, soporte TI y servicios de impresión 3D a medida.
    </p>

    <div class="accionesInicio">
      <a class="contactame" href="#app-cotizacion">Contactar / Cotizar</a>
    </div>
  </div>

  <a
    href="#app-servicios"
    (click)="irASiguienteSeccion($event)"
    (keydown.space)="irASiguienteSeccion($event)"
    class="indicador-scroll"
    data-aos="fade-up"
    data-aos-delay="200"
    aria-label="Desplazarse hacia abajo"
  >
    <svg class="flecha-scroll" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M5 9l7 6 7-6"/>
    </svg>
  </a>
</section>

<section class="contenedor">
  <div
    data-aos="fade-down"
    class="perfil"
    (mousemove)="mouseMove($event)"
    [ngStyle]="{ 'background-position': positionBackground }"
  >
    <h1>
      <span id="text1" class="word">Soluciones en Hardware, Soporte TI y Fabricación Digital</span>
    </h1>
  </div>

  <div class="presentacion">
    <p data-aos="zoom-in" class="descripcionHero">
      Mantenimiento preventivo y correctivo de equipos de cómputo, diagnóstico de impresoras y prototipado 3D a medida.
    </p>

    <div class="disponibilidad" data-aos="zoom-in">
      <span class="status-dot"></span>
      <span class="status-text">Disponible para servicios y proyectos</span>
    </div>

    <div class="accionesInicio">
      <a data-aos="fade-right" class="contactame" href="#app-contactame">Contactar / Cotizar</a>
      <a
        data-aos="fade-up"
        class="descargar-outline"
        href="./assets/documents/cv-jehan-hurtado.pdf"
        target="_blank"
        download="CV-Jehan-Hurtado.pdf"
      >Descargar CV</a>
    </div>

    <div class="enlace-secundario" data-aos="fade-left">
      <a
        target="_blank"
        rel="noopener noreferrer"
        href="https://ia.nas-jankos.com/"
      >Acceder a JankOS &rarr;</a>
    </div>
  </div>
</section>
